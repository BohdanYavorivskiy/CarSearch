name: Scrape MX-5 sold lots

on:
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:
    inputs:
      transmission:
        description: "manual / automatic / any"
        default: "any"
      year_from:
        description: "min year (empty = all)"
        default: ""
      max_pages:
        description: "listing pages per model slug"
        default: "20"

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt matplotlib playwright && python -m playwright install --with-deps chromium

      - name: Scrape
        env:
          BIDFAX_COOKIE: ${{ secrets.BIDFAX_COOKIE }}
          BIDFAX_USER_AGENT: ${{ secrets.BIDFAX_USER_AGENT }}
        run: |
          ARGS="--transmission ${{ inputs.transmission || 'any' }} --max-pages ${{ inputs.max_pages || '20' }}"
          if [ -n "${{ inputs.year_from }}" ]; then ARGS="$ARGS --year-from ${{ inputs.year_from }}"; fi
          python -m carsearch scrape --backend playwright $ARGS || python -m carsearch scrape --backend curl $ARGS

      - name: Photo damage analysis (only if ANTHROPIC_API_KEY secret is set)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        if: env.ANTHROPIC_API_KEY != ''
        run: python -m carsearch photos --backend curl --limit 40

      - run: python -m carsearch report

      - name: Commit dataset
        run: |
          git config user.name "carsearch-bot"
          git config user.email "carsearch-bot@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "data: update MX-5 lots $(date -u +%F)"
          git push
